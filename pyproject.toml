[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sca-rtlf"
version = "0.1.0"
description = "CS6530 Theme 13: statistical timing side-channel detection (RTLF) - shared code"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
